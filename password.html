<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña</title>
  <!-- Archivo de estilos exclusivo para esta pantalla -->
  <link rel="stylesheet" href="styles2.css" />
  <!-- Iconos para la flecha de regresar si usas Font Awesome -->
  <link rel="stylesheet" href="https://cloudflare.com" />
</head>
<body>

  <!-- Cabecera Superior -->
  <header class="recovery-header">
    <div class="header-container">
      <!-- La figura '<' es el único botón interactivo que regresa al index -->
      <a href="index.html" class="back-figure" aria-label="Volver al inicio de sesión">&lt;</a>
      <!-- El texto permanece intacto como un título puro -->
      <span class="header-title">Recuperar contraseña</span>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="recovery-wrapper">
    <div class="recovery-card">
      
      <h1 class="recovery-title">¿No recuerdas tu contraseña?</h1>
      <p class="recovery-subtitle">Ingresa el <strong>usuario</strong> con el que te registraste.</p>

      <form id="recovery-form" class="recovery-form" novalidate>
        
        <!-- Campo Usuario con la línea inferior gris -->
        <div class="field-recovery">
          <input
            type="text"
            id="recovery-username"
            name="recovery-username"
            placeholder=" "
            required
          />
          <label for="recovery-username" class="floating-label-recovery">Usuario</label>
        </div>

        <!-- Enlace de olvido de usuario // aqui va ¿Olvidaste tu usuario?-->
        <div class="secondary-forgot-container">
          <a href="#" class="secondary-forgot-link"></a> 
        </div>

        <!-- Mensaje de alerta idéntico al del index.html -->
        <p id="form-message" class="form-message" role="alert" aria-live="polite" style="min-height: 20px; margin: 15px 0; font-size: 13px; font-weight: 600; text-align: center;"></p>

        <!-- Botón Continuar Rosado pegado al fondo inferior -->
        <button type="submit" class="btn-continue">Continuar</button>
      </form>

    </div>
  </main>

  <!-- Vinculación del script independiente de navegación -->
  <script src="password.js"></script>
</body>
</html>
